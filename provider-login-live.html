<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner Sign In | Crossing Sunsets™</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,470;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A2226; --ink-soft:#1B3B40; --paper:#F4F7F5; --card:#FFFFFF;
  --teal:#0E6E7A; --teal-deep:#063137; --gold:#C9932E; --coral:#D95D3D;
  --line:#DCE6E3; --muted:#4E6A68;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EAF2F0;--ink-soft:#C9DAD7;--paper:#08191C;--card:#0F2A2E;--line:#1D3B3E;--muted:#8FA9A6;}}
:root[data-theme="dark"]{--ink:#EAF2F0;--ink-soft:#C9DAD7;--paper:#08191C;--card:#0F2A2E;--line:#1D3B3E;--muted:#8FA9A6;}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:"Fraunces",Georgia,serif;color:var(--ink);margin:0;letter-spacing:-.01em;font-weight:470}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
img{max-width:100%;display:block}
a{color:inherit}
header{border-bottom:1px solid var(--line)}
.nav{max-width:760px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:32px}
.brand span{font-family:"Fraunces",serif;font-size:18px;font-weight:600}
.nav a.back{font-size:14px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a.back:hover{color:var(--teal)}

.wrap{max-width:640px;margin:0 auto;padding:56px 24px 100px}
.eyebrow{font-size:14px;color:var(--teal);font-weight:600;margin-bottom:10px}
h1{font-size:2.1rem;line-height:1.1}
.lead{margin-top:14px;color:var(--muted);font-size:1.05rem;line-height:1.55}

.progress{display:flex;gap:8px;margin:36px 0 32px}
.progress .seg{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .seg i{display:block;height:100%;width:0%;background:var(--teal);transition:width .3s}
.progress .seg.done i{width:100%}
.progress .seg.active i{width:50%}

fieldset{border:none;padding:0;margin:0 0 30px}
legend{font-family:"Fraunces",serif;font-size:1.15rem;font-weight:600;margin-bottom:16px;padding:0}
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field .opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.check a{color:var(--teal);font-weight:600;text-decoration:none}
.check a:hover{text-decoration:underline}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5}

.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:15.5px;border:none;cursor:pointer;font-family:inherit;transition:transform .2s, box-shadow .2s;width:100%}
.btn-primary{background:var(--teal-deep);color:#fff;box-shadow:0 10px 24px -10px rgba(6,49,55,.5)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none}
.msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.msg.error{color:#B23A2A}
.msg.success{color:#0E6E7A}

.success-screen{text-align:center;padding:40px 0}
.success-screen img{width:64px;margin:0 auto 18px}
.success-screen h2{font-size:1.6rem}
.success-screen p{color:var(--muted);margin-top:12px;line-height:1.6;max-width:44ch;margin-left:auto;margin-right:auto}

.tier-hint{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.tier-chip{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.4;transition:border-color .2s, background .2s}
.tier-chip b{display:block;font-family:"Fraunces",serif;font-size:14px;font-weight:600;margin-bottom:2px}
.tier-chip .p{color:var(--muted)}
.tier-chip.match{border-color:var(--teal);background:color-mix(in srgb, var(--teal) 8%, var(--card))}
.tier-chip.match .p{color:var(--teal)}
.status-card{margin-top:32px;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:22px 24px}
.status-card h2{font-size:1.25rem}
.status-card p{color:var(--muted);line-height:1.55;margin:8px 0 0}
.pill{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.pill.approved{background:color-mix(in srgb,var(--teal) 18%,var(--card));color:var(--teal)}
.pill.in_progress{background:color-mix(in srgb,var(--gold) 20%,var(--card));color:var(--gold)}
.linkbtn{background:none;border:none;color:var(--teal);font:inherit;font-weight:600;cursor:pointer;padding:0}
.alt{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
.alt a{color:var(--teal);font-weight:600;text-decoration:none}
</style>
</head>

  approved:    {label:'Approved',       text:"You're approved. Welcome to Crossing Sunsets — we'll be in touch about next steps."}
};

function setMsg(t, kind='error'){ const m=$('msg'); m.textContent=t; m.className='msg '+(t?kind:''); }

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); setMsg('');
  const email=$('email').value.trim(), pw=$('password').value;
  if(!email||!pw){ setMsg('Please enter your email and password.'); return; }
  const btn=$('loginBtn'); btn.disabled=true; btn.textContent='Signing in…';
  try { await signInWithEmailAndPassword(auth, email, pw); }
  catch(err){ console.error(err); setMsg('Sign-in failed. Check your email and password.'); }
  btn.disabled=false; btn.textContent='Sign in';
});

$('forgotBtn').addEventListener('click', async () => {
  const email=$('email').value.trim();
  if(!email){ setMsg('Enter your email above first, then click "Forgot password?".'); return; }
  try { await sendPasswordResetEmail(auth, email); setMsg('Reset email sent — check your inbox.','success'); }
  catch(err){ setMsg('Could not send a reset email. Check the address and try again.'); }
});

$('signoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if(!user){ $('loginView').style.display='block'; $('statusView').style.display='none'; return; }
  $('loginView').style.display='none'; $('statusView').style.display='block';
  const list=$('statusList'); list.innerHTML='<p class="lead">Loading…</p>';
  try {
    const snap = await getDocs(query(collection(db,'applications'), where('uid','==',user.uid)));
    if(snap.empty){
      list.innerHTML = `<div class="status-card"><h2>No application yet</h2><p>We couldn't find an application for this account.</p><a href="provider-signup-live.html" class="btn btn-primary" style="margin-top:16px;width:auto;padding:0 28px">Start your application</a></div>`;
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const a=d.data(), st=STATUS[a.status] || {label:a.status||'Unknown', text:''};
      return `<div class="status-card"><h2>${esc(a.businessName)}</h2><p>${esc(a.city)}${a.state?', '+esc(a.state):''}</p><span class="pill ${esc(a.status)}">${esc(st.label)}</span><p>${esc(st.text)}</p></div>`;
    }).join('');
  } catch(err){
    console.error(err);
    list.innerHTML = '<div class="status-card"><h2>Couldn\u2019t load your status</h2><p>Please try again in a moment.</p><p style="font-size:12px;opacity:.6">Error: '+esc(err.code||err.message||'unknown')+'</p></div>';
  }
});
</script>
</body>
</html>
