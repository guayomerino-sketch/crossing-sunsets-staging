<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Provider Profile | Crossing Sunsets™</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,470;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A2226; --ink-soft:#1B3B40; --paper:#F4F7F5; --card:#FFFFFF;
  --teal:#0E6E7A; --teal-deep:#063137; --gold:#C9932E; --coral:#D95D3D;
  --line:#DCE6E3; --muted:#4E6A68;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#EAF2F0;--ink-soft:#C9DAD7;--paper:#08191C;--card:#0F2A2E;--line:#1D3B3E;--muted:#8FA9A6;}
}
:root[data-theme="dark"]{--ink:#EAF2F0;--ink-soft:#C9DAD7;--paper:#08191C;--card:#0F2A2E;--line:#1D3B3E;--muted:#8FA9A6;}
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;color:var(--ink);margin:0;letter-spacing:-.01em;font-weight:470}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
img{max-width:100%;display:block}
a{color:inherit}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:color-mix(in srgb, var(--paper) 82%, transparent);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:34px;width:auto}
.brand span{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:var(--ink)}
.navlinks{display:flex;align-items:center;gap:28px;font-size:14.5px;font-weight:500}
.navlinks a{text-decoration:none;color:var(--ink-soft);transition:color .2s}
.navlinks a:hover{color:var(--teal)}
.navlinks .cta{background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-weight:600}
.navlinks .cta:hover{background:var(--teal)}
@media (max-width:720px){.navlinks a:not(.cta){display:none}}

/* ---- hero ---- */
.hero{max-width:1180px;margin:0 auto;padding:72px 24px 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media (max-width:880px){.hero{grid-template-columns:1fr;padding-top:48px;text-align:left}}
.hero-eyebrow{font-size:14.5px;color:var(--teal);font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.06}
.hero p.lead{margin-top:22px;font-size:1.2rem;line-height:1.55;color:var(--muted);max-width:36ch}
.hero-cta{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:15.5px;text-decoration:none;transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s}
.btn-primary{background:var(--teal-deep);color:#fff;box-shadow:0 10px 24px -10px rgba(6,49,55,.55)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(6,49,55,.6)}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.hero-stat{margin-top:34px;font-size:14px;color:var(--muted)}
.hero-stat b{color:var(--ink);font-family:"Fraunces",serif;font-weight:600;font-size:17px}

.hero-art{position:relative;display:flex;align-items:center;justify-content:center}
.hero-art .glow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--gold) 35%, transparent), transparent 70%);filter:blur(10px)}
.hero-art img{width:min(360px,80%);position:relative;filter:drop-shadow(0 30px 40px rgba(6,49,55,.25))}
.hero-reveal{opacity:0;transform:translateY(16px) scale(.98)}
.hero-reveal.show{animation:reveal .85s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-reveal{opacity:1;transform:none;animation:none}}

/* ---- filter/search ---- */
.controls{max-width:1180px;margin:64px auto 0;padding:0 24px}
.tabstrip{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabstrip::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;padding:12px 16px 14px;font:inherit;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:600}
.tab-underline{position:absolute;bottom:-1px;height:2px;background:var(--coral);border-radius:2px;transition:left .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1)}
.searchrow{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.searchbox{flex:1;min-width:240px;position:relative}
.searchbox input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 18px;font:inherit;font-size:15.5px;color:var(--ink);outline:none;transition:border-color .2s}
.searchbox input:focus{border-color:var(--teal)}
.searchbox input::placeholder{color:var(--muted)}

/* ---- results ---- */
.results-wrap{max-width:1180px;margin:0 auto;padding:44px 24px 100px}
.section-label{font-size:14.5px;font-weight:600;color:var(--teal);margin-bottom:6px}
.section-title{font-size:1.6rem;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pcard:hover{transform:translateY(-3px);box-shadow:0 18px 34px -18px rgba(6,49,55,.3)}
.pcard.spot{border-color:color-mix(in srgb, var(--gold) 55%, var(--line))}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pc-name{font-family:"Fraunces",serif;font-size:1.25rem;font-weight:600;line-height:1.2}
.pc-loc{font-size:13.5px;color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge-spot{background:color-mix(in srgb, var(--gold) 22%, var(--card));color:#8A5E12}
.badge-type{background:color-mix(in srgb, var(--teal) 14%, var(--card));color:var(--teal)}
.lotus-row{display:flex;gap:3px;align-items:center}
.lotus-row img{width:15px;height:15px}
.lotus-row img.dim{opacity:.22;filter:grayscale(1)}
.lotus-row small{margin-left:6px;color:var(--muted);font-size:12.5px}
.pc-desc{font-size:14.5px;line-height:1.55;color:var(--muted);flex:1}
.pc-beds{font-size:13px;font-weight:700;color:#B23A2A;background:color-mix(in srgb, var(--coral) 12%, var(--card));display:inline-block;padding:5px 10px;border-radius:8px}
.pc-actions{display:flex;gap:10px;margin-top:4px}
.pc-actions .btn{height:42px;padding:0 16px;font-size:14px;flex:1}
.empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}

/* ---- spotlight explainer ---- */
.explain{background:var(--teal-deep);color:#EAF6F4}
.explain-in{max-width:1180px;margin:0 auto;padding:80px 24px}
.explain h2{color:#fff;font-size:2rem;max-width:22ch}
.explain p.sub{color:#B9D8D4;margin-top:14px;font-size:1.05rem;max-width:52ch;line-height:1.6}
.trait-row{margin-top:46px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media (max-width:820px){.trait-row{grid-template-columns:1fr 1fr}}
.trait{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px}
.trait img{width:30px;height:30px;margin-bottom:12px}
.trait h3{color:#fff;font-size:16px;font-weight:600}
.trait p{color:#AFCFCB;font-size:13.5px;margin-top:6px;line-height:1.5}
.explain-note{margin-top:38px;font-size:13.5px;color:#9FC5C1;max-width:60ch;line-height:1.6}

/* ---- footer ---- */
footer{border-top:1px solid var(--line)}
.foot-in{max-width:1180px;margin:0 auto;padding:44px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
.foot-brand{display:flex;align-items:center;gap:10px}
.foot-brand img{height:24px}
.foot-brand span{font-family:"Fraunces",serif;font-weight:600}
footer .muted{font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.lotus-explain{display:flex;flex-direction:column;gap:22px}
.lotus-row-click{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.lotus-btn{background:none;border:none;cursor:pointer;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:16px;transition:transform .2s, background .2s;font-family:inherit;color:inherit}
.lotus-btn:hover{transform:translateY(-3px)}
.lotus-btn img{width:44px;height:44px;opacity:.55;filter:grayscale(.4);transition:opacity .25s, filter .25s, transform .25s}
.lotus-btn[aria-pressed="true"]{background:rgba(255,255,255,.08)}
.lotus-btn[aria-pressed="true"] img{opacity:1;filter:none;transform:scale(1.08)}
.lotus-btn span{font-size:13px;font-weight:600}
.lotus-detail{min-height:64px;border-radius:16px;padding:20px 24px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:14.5px;line-height:1.55;color:#eaf6f4}
.lotus-detail b{font-family:"Fraunces",serif;font-weight:600;display:block;margin-bottom:4px}

.prof{max-width:880px;margin:0 auto;padding:40px 24px 100px}
.back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:26px}
.back:hover{color:var(--teal)}
.pcard.big{padding:34px;gap:18px}
.pcard.big:hover{transform:none;box-shadow:none}
.pcard.big .pc-name{font-size:2rem;font-weight:470}
.lotus-row.big img{width:22px;height:22px}
.lotus-row.big small{font-size:14px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
.info div{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.info b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.info a{color:var(--teal);font-weight:600;text-decoration:none;word-break:break-word}
.pc-desc.full{font-size:15.5px;flex:none;white-space:pre-line}
</style>
</head>

function lotusRow(n){
  return `<div class="lotus-row big">${[0,1,2,3].map(i=>`<img src="${LOTUS}" class="${i<n?'':'dim'}" alt="">`).join('')}<small>${n||0} of 4${'REVIEWS'}</small></div>`;

function notFound(msg){
  $('content').innerHTML = `<div class="empty">${msg}<br><br><a class="btn btn-ghost" href="lotus-network-live.html#network">Browse the Lotus Network</a></div>`;
}

  const reviews = p.reviewCount ? ` · ${p.reviewCount} family review${p.reviewCount===1?'':'s'}` : '';
  $('content').innerHTML = `<article class="pcard big ${spot?'spot':''}">
    <div class="pc-top">
      <div><h1 class="pc-name">${esc(p.businessName)}</h1><div class="pc-loc">📍 ${esc(p.city)}, ${esc(p.state)}</div></div>
      <span class="badge badge-type">${esc(LABEL[p.providerType]||p.providerType||'Provider')}</span>
    </div>
    ${spot ? '<span class="badge badge-spot" style="align-self:flex-start">✨ Lotus Spotlight</span>' : ''}
    ${lotusRow(p.lotusRating).replace('REVIEWS', reviews)}
    ${beds}
    <p class="pc-desc full">${esc(p.description || p.bio || 'Verified member of the Lotus Network.')}</p>
    <div class="info">
      <div><b>Location</b>${addr}</div>
      ${p.phone ? `<div><b>Phone</b><a href="tel:${esc(tel)}">${esc(p.phone)}</a></div>` : ''}
      ${site ? `<div><b>Website</b><a href="${esc(site)}" target="_blank" rel="noopener">${esc(p.website)}</a></div>` : ''}
      ${p.patientAdvocate ? `<div><b>Patient advocate</b>${esc(p.patientAdvocate)}</div>` : ''}
    </div>
    <div class="pc-actions">
      ${tel ? `<a class="btn btn-primary" href="tel:${esc(tel)}">Call ${esc(p.phone)}</a>` : ''}
      ${site ? `<a class="btn btn-ghost" href="${esc(site)}" target="_blank" rel="noopener">Visit website</a>` : ''}
    </div>
  </article>`;
}
load();
</script>
</body>
</html>
